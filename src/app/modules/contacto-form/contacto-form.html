
<form class="form-contacto p-4 rounded-3 shadow">

  
  <div class="mb-3">

    
    <input
      type="text"
      class="form-control custom-input"
      placeholder="Nombre Completo">

  </div>

  
  <div class="mb-3">

    
    <input
      type="text"
      class="form-control custom-input"
      placeholder="Dirección">

  </div>

  
  <div class="mb-3">

    
    <input
      type="email"
      class="form-control custom-input"
      placeholder="Correo Electrónico">

  </div>

  
  <div class="mb-3">

    
    <input
      type="tel"
      class="form-control custom-input"
      placeholder="Número de Teléfono">

  </div>

  
  <div class="mb-4">

    
    <textarea
      class="form-control custom-input"
      rows="4"
      placeholder="Escribe tu mensaje aquí..."></textarea>

  </div>

  
  <div class="col-12 mt-3">

    
    <button
      type="button"
      (click)="enviarFormulario()"
      class="btn btn-enviar-contacto w-100 fw-bold">

      ENVIAR MENSAJE

    </button>

  </div>

</form>
