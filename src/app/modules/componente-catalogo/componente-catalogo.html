<main class="container my-5">
  <!-- Indicador de carga -->
  <div *ngIf="cargando" class="text-center text-white my-5">
    <div class="spinner-border text-danger" role="status">
      <span class="visually-hidden">Cargando camiones...</span>
    </div>
    <p class="mt-2">Cargando catálogo...</p>
  </div>

  <!-- Contenido principal: solo cuando NO está cargando -->
  <div *ngIf="!cargando">
    <!-- Mensaje si no hay datos -->
    <div *ngIf="catalogo.length === 0" class="text-center text-white my-5">
      No se encontraron camiones.
    </div>

    <!-- Si hay datos, mostrar el catálogo -->
    <div *ngIf="catalogo.length > 0">
      <header class="row mb-5">
        <div class="col-12 text-center">
          <h2 class="text-danger fw-bold display-4">CATÁLOGO DE CAMIONES</h2>
        </div>
      </header>

      <section class="mb-5" *ngFor="let categoria of catalogo">
        <div class="row">
          <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let camion of categoria.listado">
            <div class="card h-100 bg-dark text-white border-danger shadow-lg">
              <img
                [src]="camion.imagen"
                class="card-img-top"
                [alt]="camion.nombre"
                style="height: 220px; object-fit: cover"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold text-danger">{{ camion.nombre }}</h5>
                <p class="card-text mb-2"><strong>Marca:</strong> {{ camion.marca }}</p>
                <p class="card-text mb-2"><strong>Motor:</strong> {{ camion.motor }}</p>
                <p class="card-text mb-3"><strong>Potencia:</strong> {{ camion.potencia }}</p>
                <div class="mt-auto">
                  <h4 class="fw-bold text-white mb-3">
                    {{ camion.precio | currency: 'COP' : 'symbol' : '1.0-0' }}
                  </h4>
                  <a class="btn btn-danger w-100 fw-bold" [routerLink]="['/cotizacion', camion.id]">
                    Cotizar Camión
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</main>
