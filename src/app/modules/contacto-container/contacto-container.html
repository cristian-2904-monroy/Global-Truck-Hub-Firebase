<!-- Sección principal de contacto -->
<section class="contacto-seccion py-5">

  <!-- Contenedor principal -->
  <div class="container">

    <!-- Fila que organiza el contenido en columnas -->
    <div class="row align-items-center">

      <!-- Columna izquierda con información de contacto -->
      <div class="col-md-5 text-white mb-5 mb-md-0">

        <!-- Título principal de la sección -->
        <h2 class="display-5 fw-bold text-danger mb-3">
          Ponte en contacto
        </h2>

        <!-- Texto descriptivo para el usuario -->
        <p class="fs-5 fw-light mb-4">
          Para tener el gusto de atender todas tus dudas e inquietudes,
          déjanos tus datos y un asesor se comunicará contigo lo antes posible.
        </p>

        <!-- Contenedor del logo -->
        <div class="logo-contacto-container">

          <!-- Logo de la empresa -->
          <img
            src="recursos/LogoCont.png"
            alt="Global Truck Hub"
            class="img-fluid logo-contacto">

        </div>

      </div>

      <!-- Columna derecha que contiene el formulario de contacto -->
      <div class="col-md-7">

        <!-- Componente encargado de mostrar el formulario -->
        <app-contacto-form></app-contacto-form>

      </div>

    </div>
  </div>

  <!-- Contenedor para mostrar el mapa -->
  <div class="container-fluid px-4 mt-5">

    <!-- Fila centrada -->
    <div class="row justify-content-center">

      <!-- Columna que ocupa todo el ancho disponible -->
      <div class="col-12 mapa-wrapper">

        <!-- Tarjeta que contiene el mapa -->
        <div class="card bg-dark border-secondary shadow-lg rounded-4 overflow-hidden">

          <!-- Encabezado de la tarjeta -->
          <div class="card-header bg-secondary text-white fw-bold py-3">

            <!-- Ícono de ubicación -->
            <i class="bi bi-geo-alt-fill me-2"></i>

            <!-- Título del mapa -->
            Nuestra Ubicación

          </div>

          <!-- Cuerpo de la tarjeta -->
          <div class="card-body p-0">

            <!-- Componente encargado de mostrar el mapa -->
            <app-map-container></app-map-container>

          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- Sección con información de contacto adicional -->
  <div class="row text-white py-4 mt-3 justify-content-center">

    <!-- Bloque del teléfono -->
    <div class="col-md-3 d-flex align-items-center mb-3 mb-md-0 justify-content-center">

      <!-- Ícono de teléfono -->
      <i class="bi bi-telephone-outbound fs-3 text-danger me-3"></i>

      <div>

        <!-- Etiqueta -->
        <p class="mb-1 fw-bold text-danger fs-5">Phone</p>

        <!-- Número telefónico -->
        <p class="mb-0 fw-bold">+57 1234567891</p>

      </div>
    </div>

    <!-- Bloque del correo electrónico -->
    <div class="col-md-3 d-flex align-items-center mb-3 mb-md-0 justify-content-center">

      <!-- Ícono de correo -->
      <i class="bi bi-envelope-at fs-3 text-danger me-3"></i>

      <div>

        <!-- Etiqueta -->
        <p class="mb-0 fw-bold text-danger fs-5">E-mail</p>

        <!-- Dirección de correo -->
        <p class="mb-0 fw-bold">info@globaltruck.com</p>

      </div>
    </div>

    <!-- Bloque del centro de ayuda -->
    <div class="col-md-4 d-flex align-items-center justify-content-center">

      <!-- Ícono de soporte -->
      <i class="bi bi-headset fs-3 text-danger me-3"></i>

      <div>

        <!-- Etiqueta -->
        <p class="mb-0 fw-bold text-danger fs-5">Helpdesk</p>

        <!-- Enlace al sitio web de soporte -->
        <a
          href="https://GlobalTruckHub.com"
          class="text-white text-decoration-none fw-bold">
          https://GlobalTruckHub.com
        </a>

      </div>
    </div>

  </div>

</section>
